<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Upload · TrustVault</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container narrow"><a class="back" th:href="@{/documents}">← Back to documents</a><h1>Upload a document</h1><p class="muted">Files are stored outside the public web directory. Maximum 10 MB.</p><div class="alert" th:if="${error}" th:text="${error}"></div><form class="panel formgrid" th:action="@{/documents}" th:object="${form}" method="post" enctype="multipart/form-data"><label>Document title<input th:field="*{title}" required maxlength="180"><small class="field-error" th:errors="*{title}"></small></label><label>Category<select th:field="*{category}" required><option value="">Choose category</option><option>HR</option><option>Salary</option><option>Contract</option><option>Finance</option><option>Legal</option><option>Engineering</option><option>Other</option></select><small class="field-error" th:errors="*{category}"></small></label><label class="span2">Description<textarea th:field="*{description}" rows="3" maxlength="1000"></textarea></label><label class="span2">File (PDF, DOCX, XLSX, PNG, JPG, TXT)<input type="file" th:field="*{file}" required accept=".pdf,.docx,.xlsx,.png,.jpg,.jpeg,.txt"><small class="muted">Allowed file extensions are validated by the backend. Do not upload executable files.</small></label><div class="span2 formactions"><button class="primary" type="submit">Upload securely</button><a class="button secondary" th:href="@{/documents}">Cancel</a></div></form></main></body></html>
