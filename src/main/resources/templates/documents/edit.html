<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit · TrustVault</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container narrow"><a class="back" th:href="@{/documents/{id}(id=${document.id})}">← Back to document</a><h1>Edit document details</h1><form class="panel formgrid" th:action="@{/documents/{id}/edit(id=${document.id})}" th:object="${form}" method="post"><label>Title<input th:field="*{title}" required maxlength="180"></label><label>Category<input th:field="*{category}" required maxlength="80"></label><label class="span2">Description<textarea th:field="*{description}" rows="4" maxlength="1000"></textarea></label><div class="span2 formactions"><button class="primary" type="submit">Save changes</button><a class="button secondary" th:href="@{/documents/{id}(id=${document.id})}">Cancel</a></div></form></main></body></html>
