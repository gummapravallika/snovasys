<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit employee · TrustVault</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container narrow"><a class="back" th:href="@{/employees}">← Employees</a><h1>Edit employee</h1><form class="panel formgrid" th:action="@{/employees/{id}/edit(id=${employee.id})}" th:object="${form}" method="post"><label>Full name<input th:field="*{fullName}" required maxlength="120"><small class="field-error" th:errors="*{fullName}"></small></label><label>Email<input type="email" th:field="*{email}" required><small class="field-error" th:errors="*{email}"></small></label><label>Department<input th:field="*{department}" required maxlength="120"></label><label>Role<select th:field="*{role}" required><option th:each="r:${roles}" th:value="${r}" th:text="${r}"></option></select></label><label class="span2">Reset password (optional)<input type="password" th:field="*{password}" minlength="12" autocomplete="new-password"><small class="muted">Leave blank to keep the current password. If provided, use at least 12 characters.</small><small class="field-error" th:errors="*{password}"></small></label><div class="span2 formactions"><button class="primary" type="submit">Save employee</button><a class="button secondary" th:href="@{/employees}">Cancel</a></div></form></main></body></html>
