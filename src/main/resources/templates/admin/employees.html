<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Employees · TrustVault</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container"><div class="pagehead"><div><p class="eyebrow">ADMINISTRATION</p><h1>Employees</h1><p class="muted">Manage employee accounts and roles.</p></div><a class="primary" th:href="@{/employees/new}">＋ Add employee</a></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="u:${employees}"><td th:text="${u.fullName}"></td><td th:text="${u.email}"></td><td th:text="${u.department}"></td><td><span class="pill" th:text="${u.role}"></span></td><td><span class="pill" th:text="${u.enabled?'Active':'Disabled'}"></span></td><td class="actions"><a th:href="@{/employees/{id}/edit(id=${u.id})}">Edit</a><form th:if="${u.enabled}" th:action="@{/employees/{id}/disable(id=${u.id})}" method="post" onsubmit="return confirm('Disable this employee account?')" style="display:inline"><button class="danger smallbtn" type="submit">Disable</button></form></td></tr></tbody></table></div></main></body></html>
