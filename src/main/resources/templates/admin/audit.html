<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Audit trail · TrustVault</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container"><div class="pagehead"><div><p class="eyebrow">SECURITY & COMPLIANCE</p><h1>Audit trail</h1><p class="muted">Latest 500 events, newest first. Access to this view is restricted to administrators.</p></div></div><form class="filterbar" method="get" th:action="@{/admin/audit}"><input name="actor" placeholder="Filter by actor email" th:value="${actor}"><button class="primary" type="submit">Filter</button><a class="button secondary" th:href="@{/admin/audit}">Reset</a></form><div class="tablewrap"><table><thead><tr><th>Timestamp (UTC)</th><th>Actor</th><th>Action</th><th>Outcome</th><th>Document</th><th>Details</th><th>Request ID</th></tr></thead><tbody><tr th:each="e:${events}"><td class="nowrap" th:text="${#temporals.format(e.occurredAtDisplay,'yyyy-MM-dd HH:mm:ss')}"></td><td th:text="${e.actorEmail}"></td><td><span class="pill" th:text="${e.action}"></span></td><td><span th:class="${e.outcome=='SUCCESS'?'status-ok':'status-denied'}" th:text="${e.outcome}"></span></td><td><span th:text="${e.documentTitle}"></span><div class="tiny" th:text="${e.documentId}"></div></td><td th:text="${e.details}"></td><td class="tiny" th:text="${e.requestId}"></td></tr><tr th:if="${#lists.isEmpty(events)}"><td colspan="7" class="empty">No audit events found.</td></tr></tbody></table></div></main></body></html>
