<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · TrustVault</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="login-bg"><main class="login-card"><div class="logo">🔐</div><h1>TrustVault</h1><p class="muted">Secure employee document sharing</p><div class="alert" th:if="${param.error}">Invalid email or password.</div><div class="success" th:if="${param.logout}">You have signed out.</div><form th:action="@{/login}" method="post"><label>Email address<input type="email" name="email" required autofocus autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="primary full" type="submit">Sign in securely</button></form><p class="tiny">Access is monitored. Document activity is recorded.</p></main></body></html>
